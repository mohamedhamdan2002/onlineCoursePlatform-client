<div class="min-h-screen flex flex-col items-center justify-center gap-4">
  <mat-icon class="text-orange-400 !text-8xl !w-auto !h-auto">cloud_off</mat-icon>
  <h1 class="text-9xl font-extrabold text-gray-200">500</h1>
  <h2 class="text-3xl font-bold text-gray-800 -mt-4">Server Error</h2>
  <p class="text-gray-500 text-lg">Something went wrong on our end. Please try again later.</p>
  <div class="flex gap-3 mt-4">
    <a mat-stroked-button routerLink="/courses">Go to Courses</a>
    <button mat-flat-button (click)="retry()">Try Again</button>
  </div>
</div>
