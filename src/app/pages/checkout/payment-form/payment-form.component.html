<div class="p-4 border">
  <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
    <mat-icon>payment</mat-icon>
    Payment Options
  </h2>
  <div>
    <mat-radio-group [value]="'paypal'">
      <mat-radio-button value="paypal">
        <img src="/paypal.png" alt="stripe" class="h-15"/>
      </mat-radio-button>
    </mat-radio-group>
  </div>
  <div>
    <app-paypal [courseId]="courseId()"/>
  </div>
</div>
