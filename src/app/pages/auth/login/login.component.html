
<form>
<h2 mat-dialog-title class="text-center">Sign In</h2>
<mat-dialog-content>
  <p class="mb-4 text-center">we missed you</p>

    <mat-form-field class="w-full">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="model().email" name="email" />
    </mat-form-field>
    <!-- <mat-form-field class="w-full">
    <mat-label>Password</mat-label>
    <input matInput [(ngModel)]="model().password" />
  </mat-form-field> -->
  <app-password-input [style]="'w-full'" [label]="'password'" (inputValue)="model().password=$event"/>
  <div class="flex gap-2">
    <p>if you new student?</p>
    <a (click)="onRegisterBtnClick()">register</a>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="dialogRef.close()">Cancel</button>
  <button matButton (click)="onLoginBtnClick()"  cdkFocusInitial>Login</button>
</mat-dialog-actions>
</form>
